# Contrôleurs pour la policy : position directe à 30 Hz (pas de trajectoire, pas de MoveIt).
# Fichier séparé de thor_controller/config/thor_controllers.yaml, qui reste inchangé pour MoveIt.
controller_manager:
  ros__parameters:
    update_rate: 30  # Hz, = fréquence de la policy (read() interroge RRF par M408 à chaque cycle)

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_position_controller:
      type: position_controllers/JointGroupPositionController

    gripper_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_position_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

gripper_group_controller:
  ros__parameters:
    joints:
      - gripperbase_to_armgearright
    command_interfaces:
      - position
    state_interfaces:
      - position
    open_loop_control: true
    allow_integration_in_goal_trajectories: true
